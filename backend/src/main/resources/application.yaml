spring:
  application:
    name: gamelog

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gamelog}
    username: ${DB_USERNAME:gamelog}
    password: ${DB_PASSWORD:gamelog}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  jackson:
    mapper:
      accept-case-insensitive-enums: true

server:
  port: 8000

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

  jwt:
    secret: ${JWT_SECRET:4a6f686e446f6553656372657456657279566572795365637265744b6579466f7247616d654c6f67417070}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

  rawg:
    api-url: ${RAWG_API_URL:https://api.rawg.io/api}
    api-key: ${RAWG_API_KEY:}
